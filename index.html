<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor Topográfico 3D</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    // 1. TU TOKEN DE CESIUM ION (entre las comillas simples)
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjlnWjh5WnZVbTRSZ2s5eGUiLCJqdGkiOiI0NzQyZDU1ZS1lNzcwLTQ1OTEtYmVkMS1hYWFkYzJjNTRjYzYiLCJpZCI6NDc3MzE0LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODgxOTYzMzR9.d7HeXTwGpKuVONPPBcghXZlISjckj1wtQnxBnAMTi9M';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrain: Cesium.Terrain.fromWorldTerrain(),
      timeline: false,
      animation: false,
      baseLayerPicker: true
    });

    // 2. TU NUEVO ASSET ID (solo el número, sin comillas)
    Cesium.Cesium3DTileset.fromIonAssetId(5175694, {
      maximumScreenSpaceError: 2
    }).then(function(tileset) {
      viewer.scene.primitives.add(tileset);

      // -------------------------------------------------------------
      // 3. AJUSTE DE ALTURA EN METROS
      // Si el modelo flota en el aire: pon un valor negativo (ej: -25)
      // Si el modelo quedó bajo tierra: pon un valor positivo (ej: 25)
      // Si la altura quedó perfecta: déjalo en 0
      // -------------------------------------------------------------
      const ajusteMetros = 0; 

      if (ajusteMetros !== 100) {
        const cartographic = Cesium.Cartographic.fromCartesian(tileset.boundingSphere.center);
        const surface = Cesium.Cartesian3.fromRadians(cartographic.longitude, cartographic.latitude, 0.0);
        const offset = Cesium.Cartesian3.fromRadians(cartographic.longitude, cartographic.latitude, ajusteMetros);
        const translation = Cesium.Cartesian3.subtract(offset, surface, new Cesium.Cartesian3());
        tileset.modelMatrix = Cesium.Matrix4.fromTranslation(translation);
      }

      // Cámara inicial
      const heading = Cesium.Math.toRadians(45);
      const pitch = Cesium.Math.toRadians(-35);
      viewer.zoomTo(tileset, new Cesium.HeadingPitchRange(heading, pitch, 0));

    }).catch(function(error) {
      console.log('Error al cargar el modelo:', error);
    });
  </script>
</body>
</html>
