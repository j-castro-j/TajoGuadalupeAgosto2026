<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor Topográfico 3D</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjlnWjh5WnZVbTRSZ2s5eGUiLCJqdGkiOiI0NzQyZDU1ZS1lNzcwLTQ1OTEtYmVkMS1hYWFkYzJjNTRjYzYiLCJpZCI6NDc3MzE0LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODgxOTYzMzR9.d7HeXTwGpKuVONPPBcghXZlISjckj1wtQnxBnAMTi9M';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      // 1. Desactivamos elementos innecesarios
      timeline: false,
      animation: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false
    });

    // 2. OCULTAR EL GLOBO TERRÁQUEO Y LA ATMÓSFERA
    viewer.scene.globe.show = false;
    viewer.scene.skyAtmosphere.show = false;
    viewer.scene.skyBox.show = false;
    viewer.scene.sun.show = false;
    viewer.scene.moon.show = false;

    // 3. Fondo neutro oscuro (estilo visor 3D profesional)
    viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#1e1e1e');

    // 4. Cargar la malla en alta definición
    Cesium.Cesium3DTileset.fromIonAssetId(5175694, {
      maximumScreenSpaceError: 2
    }).then(function(tileset) {
      viewer.scene.primitives.add(tileset);

      // Cámara inicial con perspectiva oblicua
      const heading = Cesium.Math.toRadians(45);
      const pitch = Cesium.Math.toRadians(-35);
      viewer.zoomTo(tileset, new Cesium.HeadingPitchRange(heading, pitch, 0));
    }).catch(function(error) {
      console.log('Error al cargar el modelo:', error);
    });
  </script>
</body>
</html>
